<!DOCTYPE html>
<!--
  Tableau de bord de veille économique — TB « Exploration de l'IA pour les entreprises industrielles »

  Deux principes de conception, tous deux imposés par la thèse du travail.

  1. AUCUNE DONNÉE N'EST EMBARQUÉE. La page interroge l'interface de restitution
     portée par l'orchestrateur. Si la base est coupée, elle n'affiche rien et le
     dit — elle n'affiche jamais une valeur périmée.

  2. LE RÉFÉRENTIEL EST AFFICHÉ EN ENTIER. Les 26 indicateurs de la grille du
     chapitre 8 apparaissent, qu'ils soient collectés ou non. Un indicateur
     qualifié mais non instrumenté s'affiche comme tel, avec sa source et ce
     qui lui manque. Masquer les non-collectés donnerait l'illusion d'une
     couverture complète : c'est exactement la surdéclaration que le travail
     s'interdit.

  3. LA LECTURE EST CALCULÉE, JAMAIS RÉDIGÉE. La couche de lecture ajoutée le
     10.08.2026 — phrase de synthèse par onglet, position au seuil de matérialité,
     franchissements diffusables au sens de RI5 — est composée par gabarit à partir
     des métriques déterministes de v_metriques. Aucun énoncé de cette page n'est
     produit par un modèle de langage. Une restitution qui n'affiche que des mesures
     laisse son destinataire sans lecture ; une restitution qui fait interpréter un
     modèle sans traçabilité réintroduit la surdéclaration. La sortie est de faire
     dire à la page ce que le calcul établit, et rien de plus.

  Aucune dépendance externe : les graphiques sont dessinés en SVG dans la page.
  Le dispositif doit rester reproductible par une PME, y compris hors ligne.
-->

<body>

<header>
  <h1>Veille économique des marchés cibles · PME de mécanique de précision</h1>
  <div class="meta" id="meta">Interrogation de la base consolidée…</div>
</header>

<div class="bandeau" id="bandeau"></div>
<nav id="nav"></nav>
<main id="vue"><p class="note">Chargement…</p></main>

<script>
const API = "http://localhost:5678/webhook/veille/donnees";

const SECTEURS = [
  ["transversal","Contexte"],
  ["horlogerie","Horlogerie"],
  ["medical","Médical"],
  ["automobile","Automobile"],
  ["aerospatial","Aérospatial"]
];

let D = null, onglet = "transversal";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = v => v === null || v === undefined || isNaN(v) ? "—"
  : (v > 0 ? "+" : "") + Number(v).toLocaleString("fr-CH", {minimumFractionDigits: 1, maximumFractionDigits: 1}) + " %";
const signe = v => v === null || v === undefined || isNaN(v) ? "" : (v > 0 ? "hausse" : v < 0 ? "baisse" : "");

// PRÉCISION D'AFFICHAGE SUIVANT L'ORDRE DE GRANDEUR. Un arrondi fixe détruit
// l'information qu'il est censé porter : un taux de change à 0,93 arrondi à
// l'entier s'affiche « 1 », ce qui n'est pas une valeur imprécise mais une
// valeur fausse pour son lecteur. À l'inverse, trois décimales sur un flux
// commercial en USD encombrent sans rien apporter.
const nbAuto = v => {
  if (v === null || v === undefined || v === "" || isNaN(v)) return "—";
  const a = Math.abs(Number(v));
  const d = a === 0 ? 0 : a < 10 ? 3 : a < 1000 ? 1 : 0;
  // maximumFractionDigits sans minimum : 0,925 garde ses décimales, mais 3,4
  // ne devient pas « 3,400 » — qui se lirait trois mille quatre cents.
  return Number(v).toLocaleString("fr-CH", {maximumFractionDigits: d});
};

// POURCENTAGES SANS DÉCIMALES FORCÉES. nbAuto appliqué à un seuil de 5 %
// produisait « 5,000 % » — trois décimales sous 10, lisible comme cinq mille
// pour cent. Un formatage conçu pour les taux de change appliqué à un
// pourcentage fabriquait une valeur fausse pour son lecteur : le défaut
// exact que nbAuto devait corriger.
const pctNu = v => v === null || v === undefined || isNaN(v) ? "—"
  : Number(v).toLocaleString("fr-CH", {maximumFractionDigits: 1}) + " %";

// AGRÉGATS MONDE. Un agrégat mondial glissé parmi les pays d'un classement
// double le total et fausse toutes les parts. La liste est une convention de
// la page ; la vraie résolution est la nomenclature géographique normalisée
// notée en limite au § 10.6 — un attribut de la base, pas une devinette
// d'affichage.
const AGREGATS = new Set([
  // agrégats mondiaux
  "WORLD", "W00", "OWID_WRL", "GLOBAL",
  // régions OMS (M3) — des codes à trois lettres qui ne sont pas des pays
  "AFR", "AMR", "EMR", "EUR", "SEAR", "WPR",
  // libellés d'agrégats AIE (A3)
  "World", "Europe", "European Union", "Advanced Economies",
  "Developing Economies excl. China", "Africa", "Asia Pacific",
  "Latin America", "Middle East", "Oceania", "Rest of the world",
  // agrégats européens (A2, A5)
  "EU27", "EU27_2020"
]);
// Étendu le 17.08.2026 (lot 1 : M3 et A3 ont apporté régions et blocs mêlés
// aux pays). Les groupes de revenu Banque mondiale arrivent préfixés WB_.
const estAgregatMonde = g => AGREGATS.has(String(g)) || String(g).startsWith("WB_");

// UNITÉ ADDITIVE OU NON. Une part de panier ne se calcule que sur une grandeur
// extensive : additionner des exportations a un sens, additionner deux taux de
// change ou deux indices n'en a aucun. La distinction commande la forme de
// restitution des indicateurs multi-zones — sans elle, le dispositif produit
// une « part » d'apparence normale répondant à une question que personne n'a posée.
const estAdditive = unit => !/indice|taux|pourcentage|qualitatif/i.test(String(unit ?? ""));

// Courbe en SVG, sans dépendance externe : le dispositif doit rester
// reproductible par une PME, y compris hors ligne.
//
// LIGNE DE RÉFÉRENCE. Une courbe sans repère ne se lit pas : elle montre une
// forme, pas une position. Le repère tracé est la moyenne mobile annuelle,
// parce qu'elle est CALCULÉE par v_metriques et non supposée. Un niveau de
// référence propre à l'indicateur — 100 pour un indice de tendance, par
// exemple — serait une meilleure lecture encore, mais il relève d'un attribut
// du référentiel à saisir source par source, pas d'une convention devinée
// dans la page. Limite énoncée, non contournée.
// Portage v2 (10.08.2026) : le sparkline de 42 px montrait une forme, pas
// une évolution — ni axes, ni dates, ni valeurs. Le graphique porte
// désormais une grille avec niveaux, les années aux mois de janvier, la
// valeur du dernier point annotée, et la ligne de référence en pointillé.
function spark(serie, ref = null, refLabel = "") {
  if (!serie || serie.length < 2) return "";
  const W = 620, H = 210, mg = {t: 14, r: 52, b: 22, l: 8};
  const iw = W - mg.l - mg.r, ih = H - mg.t - mg.b;
  const refValide = ref !== null && ref !== undefined && !isNaN(ref);
  const vals = serie.map(p => p.value);
  let vmin = Math.min(...vals), vmax = Math.max(...vals);
  if (refValide) { vmin = Math.min(vmin, Number(ref)); vmax = Math.max(vmax, Number(ref)); }
  const pad = (vmax - vmin) * 0.12 || 1; vmin -= pad; vmax += pad;
  const X = i => mg.l + (i / (serie.length - 1)) * iw;
  const Y = v => mg.t + ih - ((v - vmin) / (vmax - vmin)) * ih;

  let grille = "";
  for (let k = 0; k <= 3; k++) {
    const v = vmin + (vmax - vmin) * k / 3, y = Y(v);
    grille += `<line x1="${mg.l}" x2="${mg.l + iw}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#EDF0F2" stroke-width="1"/>
      <text x="${W - mg.r + 6}" y="${(y + 3.5).toFixed(1)}" font-size="9.5" fill="#98A1AA">${nbAuto(v)}</text>`;
  }
  let axesX = "";
  serie.forEach((p, i) => {
    const per = String(p.period);
    if (per.endsWith("-01") || !per.includes("-")) {
      axesX += `<line x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${mg.t}" y2="${mg.t + ih}" stroke="#F2F4F6" stroke-width="1"/>
        <text x="${(X(i) + 3).toFixed(1)}" y="${H - 7}" font-size="9.5" fill="#98A1AA">${esc(per.slice(0, 4))}</text>`;
    }
  });
  let ligneRef = "";
  if (refValide) {
    const yr = Y(Number(ref));
    ligneRef = `<line x1="${mg.l}" x2="${mg.l + iw}" y1="${yr.toFixed(1)}" y2="${yr.toFixed(1)}"
        stroke="#98A1AA" stroke-width="1" stroke-dasharray="4 4"/>
      ${refLabel ? `<text x="${mg.l + 2}" y="${(yr - 4).toFixed(1)}" font-size="9.5" fill="#98A1AA">${esc(refLabel)}</text>` : ""}`;
  }
  const d = serie.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.value).toFixed(1)).join(" ");
  const aire = d + ` L ${X(serie.length - 1).toFixed(1)} ${mg.t + ih} L ${X(0).toFixed(1)} ${mg.t + ih} Z`;
  const dp = serie[serie.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" role="img"
      aria-label="Évolution sur ${serie.length} périodes, de ${esc(serie[0].period)} à ${esc(dp.period)}">
    ${grille}${axesX}${ligneRef}
    <path d="${aire}" fill="#2C5F8A" opacity=".06"/>
    <path d="${d}" fill="none" stroke="#2C5F8A" stroke-width="1.8"/>
    <circle cx="${X(serie.length - 1).toFixed(1)}" cy="${Y(dp.value).toFixed(1)}" r="3.2" fill="#2C5F8A"/>
    <text x="${(X(serie.length - 1) + 6).toFixed(1)}" y="${(Y(dp.value) + 3.5).toFixed(1)}" font-size="10.5" font-weight="650" fill="#16222E">${nbAuto(dp.value)}</text>
  </svg>`;
}

// Pastille de variation — le delta en couleur à côté de la valeur.
function chipVar(met) {
  if (!met) return "";
  const v = met.glissement_annuel_pct ?? met.variation_periode_pct;
  if (v === null || v === undefined || isNaN(v)) return "";
  const cls = v > 0 ? "d-hausse" : v < 0 ? "d-baisse" : "d-neutre";
  return `<span class="delta ${cls}">${v > 0 ? "▲" : v < 0 ? "▼" : "＝"} ${pct(v)}</span>`;
}

const badgeStatut = s => s === "certifie"
  ? '<span class="etiq e-vert">certifié</span>'
  : s === "a_confirmer" ? '<span class="etiq e-ambre">à confirmer</span>'
  : '<span class="etiq e-rouge">restreint</span>';

const badgeValidation = s => ({
  valide_source:        '<span class="etiq e-vert">validé par la source</span>',
  valide_humain:        '<span class="etiq e-vert">validé humainement</span>',
  pre_valide_consensus: '<span class="etiq e-ambre">consensus, non validé</span>',
  rejete:               '<span class="etiq e-rouge">rejeté</span>'
}[s] || '<span class="etiq e-gris">sans statut</span>');

const badgeCriticite = c => c === "dominante"
  ? '<span class="etiq e-violet">criticité dominante</span>'
  : c === "significative" ? '<span class="etiq e-gris">criticité significative</span>'
  : '<span class="etiq e-gris">criticité marginale</span>';

// ---------------------------------------------------------------------
// Détection de la nature de l'indicateur : une série unique, ou un
// panier multi-zones. La distinction commande la forme d'affichage —
// une valeur unique n'a de sens que pour une série unique. Afficher
// « la » valeur d'un indicateur qui en porte sept (une par pays) sans
// dire laquelle serait un chiffre d'apparence normale répondant à une
// question que personne n'a posée.
// ---------------------------------------------------------------------
function zonesDe(ind) {
  const zones = [...new Set((D.valeurs || [])
    .filter(v => v.indicator_id === ind.indicator_id)
    .map(v => v.geo))];
  return zones;
}

function serieDe(ind, geo) {
  return (D.valeurs || [])
    .filter(v => v.indicator_id === ind.indicator_id && (geo === undefined || v.geo === geo))
    .sort((a, b) => String(a.period).localeCompare(String(b.period)))
    .map(v => ({period: v.period, value: Number(v.value), geo: v.geo}));
}

// Une série est infra-annuelle si ses périodes portent un mois ou un
// trimestre. Sur une série annuelle, glissement annuel et variation de
// période sont le même nombre : n'en afficher qu'un.
const estInfraAnnuelle = serie => serie.some(p => /-/.test(String(p.period)));

function blocMetriques(met, serie) {
  if (!met) return "";
  const infra = estInfraAnnuelle(serie);
  const vp = met.variation_periode_pct;
  const mm = met.moyenne_mobile_annuelle;
  // Sur une série annuelle, la pastille à côté de la valeur porte déjà la
  // variation : le bloc n'ajouterait qu'une redite. Il ne s'affiche que
  // pour l'infra-annuel, où il apporte la période précédente et la moyenne.
  return `${infra ? `<div class="c-metr">
      <div>période précédente<b class="${signe(vp)}">${pct(vp)}</b></div>
      ${mm !== null && mm !== undefined ? `<div>moyenne mobile<b>${nbAuto(mm)}</b></div>` : ""}
    </div>` : ""}
    ${ligneSeuil(met)}`;
}

// La colonne completude de v_metriques énonce toute métrique manquante.
// Le segment sur le seuil de matérialité en est retiré à l'affichage —
// ligneSeuil() le dit déjà, mieux : la vue reste exhaustive (c'est elle qui
// fait foi), seule la redite à l'écran est évitée.
function afficherCompletude(met) {
  if (!met || !met.completude) return "";
  const restant = String(met.completude).split(" · ")
    .filter(s => !s.includes("materialite")).join(" · ");
  return restant ? `<div class="c-manque">${esc(restant)}</div>` : "";
}

// POSITION AU SEUIL, TOUJOURS AFFICHÉE. La version précédente ne mentionnait le
// seuil de matérialité qu'une fois franchi : le lecteur ne savait jamais à
// quelle distance il se trouvait, c'est-à-dire précisément ce qu'un seuil sert
// à dire. Les trois cas où la position est indéterminable sont énoncés plutôt
// que masqués — RI0 : signaler, ne pas conclure.
function ligneSeuil(met) {
  const seuil = met.seuil_materialite_pct;
  const ref = met.glissement_annuel_pct ?? met.variation_periode_pct;
  if (seuil === null || seuil === undefined || isNaN(seuil)) {
    return `<div class="c-seuil">Cet indicateur n'a <b>pas encore de seuil d'alerte</b> :
      impossible de dire si un mouvement est notable ou non.</div>`;
  }
  if (ref === null || ref === undefined || isNaN(ref)) {
    return `<div class="c-seuil">Le seuil d'alerte est fixé à <b>${pctNu(seuil)}</b>, mais sans
      variation calculable on ne peut pas encore situer l'indicateur.</div>`;
  }
  const ecart = Math.abs(Number(ref)) - Number(seuil);
  return ecart >= 0
    ? `<div class="c-seuil">Le seuil d'alerte (${pctNu(seuil)}) est <b class="baisse">franchi</b> :
       la variation atteint ${pctNu(Math.abs(ref))}. Ce mouvement sort de l'ordinaire pour cette série.</div>`
    : `<div class="c-seuil">Rien d'inhabituel : la variation reste <b>sous le seuil d'alerte</b>
       de ${pctNu(seuil)}, avec ${pctNu(-ecart).replace(" %", "")} point(s) de marge.</div>`;
}

// Classement multi-zones : barres horizontales triées, part du panier,
// et variation annuelle par zone. Répond à « qui pèse quoi, qui bouge »
// — la forme que QV2 et QV3 appellent, là où une valeur unique ne
// répond à rien.
//
// ANNÉE DE RÉFÉRENCE. Le classement se fait sur la dernière période où
// TOUTES les zones du panier ont déclaré, et non sur la plus récente.
// Les déclarants d'une statistique internationale ne publient pas au
// même rythme : en août 2026, sept déclarants sur huit portaient 2025,
// la Chine s'arrêtait à 2024. Classer sur la période la plus récente
// aurait affiché une part chinoise nulle et gonflé mécaniquement celle
// des autres — un effondrement apparent qui n'est qu'un retard de
// déclaration. La période la plus récente, quand elle est incomplète,
// est signalée comme information partielle avec la liste des déclarants
// manquants. La fraîcheur d'un indicateur multi-pays est celle de son
// déclarant le plus lent.
function classementZones(ind, zones) {
  const zonesReelles = zones.filter(g => !estAgregatMonde(g));
  if (!zonesReelles.length) return "";

  // Périodes couvertes par chaque zone, puis dernière période commune.
  const periodesParZone = new Map(zonesReelles.map(g =>
    [g, new Set(serieDe(ind, g).map(p => p.period))]));
  const toutesPeriodes = [...new Set(serieDe(ind).map(p => p.period))]
    .filter(p => p !== undefined).sort();

  const periodesCommunes = toutesPeriodes.filter(p =>
    zonesReelles.every(g => periodesParZone.get(g).has(p)));
  const pReference = periodesCommunes.length
    ? periodesCommunes[periodesCommunes.length - 1]
    : toutesPeriodes[toutesPeriodes.length - 1];
  const pRecente = toutesPeriodes[toutesPeriodes.length - 1];

  // Période précédant la référence, pour la variation — comparée sur les
  // mêmes périodes pour toutes les zones, sinon les variations ne sont
  // pas comparables entre elles.
  const idxRef = toutesPeriodes.indexOf(pReference);
  const pPrecedente = idxRef > 0 ? toutesPeriodes[idxRef - 1] : null;

  const parZone = zonesReelles.map(g => {
    const s = serieDe(ind, g);
    const vRef = s.find(p => p.period === pReference);
    const vPrec = pPrecedente ? s.find(p => p.period === pPrecedente) : null;
    const varPct = (vRef && vPrec && vPrec.value !== 0)
      ? (vRef.value - vPrec.value) / vPrec.value * 100 : null;
    return {geo: g, valeur: vRef ? vRef.value : null, varPct};
  }).filter(z => z.valeur !== null)
    .sort((a, b) => b.valeur - a.valeur);

  if (!parZone.length) return "";
  const total = parZone.reduce((s, z) => s + z.valeur, 0);
  const maxV = parZone[0].valeur;

  const PLAFOND_CLASSEMENT = 12;
  const ligneDe = z => {
    const part = total > 0 ? z.valeur / total * 100 : 0;
    const largeur = maxV > 0 ? Math.max(2, z.valeur / maxV * 100) : 2;
    return `<div class="z-ligne">
      <span class="z-nom">${esc(z.geo)}</span>
      <span class="z-barre"><i style="width:${largeur.toFixed(1)}%"></i></span>
      <span class="z-val">${nbAuto(z.valeur)}</span>
      <span class="z-part">${part.toFixed(1)} %</span>
      <span class="z-var ${signe(z.varPct)}">${pct(z.varPct)}</span>
    </div>`;
  };
  const lignes = parZone.slice(0, PLAFOND_CLASSEMENT).map(ligneDe).join("");
  const resteClassement = parZone.slice(PLAFOND_CLASSEMENT);
  const repliClassement = resteClassement.length
    ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--gris,#666);font-size:12px">Afficher les ${resteClassement.length} autres zones</summary>${resteClassement.map(ligneDe).join("")}</details>`
    : "";

  // Information partielle sur la période plus récente que la référence :
  // qui a déjà déclaré, qui manque. Montrée, jamais mélangée au classement.
  let blocPartiel = "";
  if (pRecente !== pReference) {
    const ontDeclare = zonesReelles.filter(g => periodesParZone.get(g).has(pRecente));
    const manquent = zonesReelles.filter(g => !periodesParZone.get(g).has(pRecente));
    blocPartiel = `<div class="z-partiel">
      <strong>${esc(pRecente)} est encore incomplète</strong> :
      ${ontDeclare.length} déclarant${ontDeclare.length > 1 ? "s" : ""} sur ${zonesReelles.length}
      ${ontDeclare.length > 1 ? "ont" : "a"} publié (il manque ${manquent.map(esc).join(", ")}).
      Le classement porte donc sur ${esc(pReference)}, la dernière période où tout le monde a déclaré.
      Classer sur l'année incomplète donnerait une part nulle aux retardataires.
    </div>`;
  }

  return `<div class="z-classement">
    <div class="z-refper">Classement au titre de <strong>${esc(pReference)}</strong>${pPrecedente ? ", variation contre " + esc(pPrecedente) : ""}</div>
    <div class="z-entete"><span></span><span></span><span>valeur</span><span>part</span><span>var. ann.</span></div>
    ${lignes}
    ${repliClassement}
    ${blocPartiel}
    <div class="z-note">Part du panier suivi (${parZone.length} zone${parZone.length > 1 ? "s" : ""}),
      non du marché mondial. La composition du panier est un choix de qualification, daté et révisable.</div>
  </div>`;
}

// ---------------------------------------------------------------------
// CARTES PAR ZONE — la forme « explorer les marchés » (revue du 12.08).
// Remplace les barres pour les paniers additifs : une carte par zone avec
// rang, part du panier, valeur, variation annuelle et un état CALCULÉ.
//
// L'ÉTIQUETTE D'ÉTAT EST UNE RÈGLE, PAS UN JUGEMENT. « Progression
// marquée » / « stable » / « recul marqué » = position de la variation
// annuelle par rapport au seuil de matérialité de l'indicateur (RI4),
// calibré sur la volatilité observée. Les étiquettes de maturité du style
// « mature » ou « orienté premium » sont volontairement absentes : ce sont
// des qualifications de marché, donc des attributs du référentiel à poser
// par un humain — pas des sorties de calcul.
// ---------------------------------------------------------------------
function etatZone(varPct, seuil) {
  if (varPct === null || varPct === undefined || isNaN(varPct)) return '<span class="etiq e-gris">sans variation</span>';
  if (seuil !== null && seuil !== undefined && !isNaN(seuil)) {
    if (Number(varPct) <= -Number(seuil)) return '<span class="etiq e-rouge">recul marqué</span>';
    if (Number(varPct) >= Number(seuil))  return '<span class="etiq e-vert">progression marquée</span>';
  }
  return '<span class="etiq e-gris">stable</span>';
}

function cartesZones(ind, zones) {
  const zonesReelles = zones.filter(g => !estAgregatMonde(g));
  if (!zonesReelles.length) return "";

  // Période de référence commune : même règle que le classement — la
  // dernière période où TOUTES les zones ont déclaré, la plus récente
  // étant signalée à part si elle est incomplète.
  const periodesParZone = new Map(zonesReelles.map(g =>
    [g, new Set(serieDe(ind, g).map(p => p.period))]));
  const toutesPeriodes = [...new Set(serieDe(ind).map(p => p.period))]
    .filter(p => p !== undefined).sort();
  const periodesCommunes = toutesPeriodes.filter(p =>
    zonesReelles.every(g => periodesParZone.get(g).has(p)));
  const pReference = periodesCommunes.length
    ? periodesCommunes[periodesCommunes.length - 1]
    : toutesPeriodes[toutesPeriodes.length - 1];
  const pRecente = toutesPeriodes[toutesPeriodes.length - 1];
  const idxRef = toutesPeriodes.indexOf(pReference);
  const pPrecedente = idxRef > 0 ? toutesPeriodes[idxRef - 1] : null;

  const parZone = zonesReelles.map(g => {
    const s = serieDe(ind, g);
    const vRef = s.find(p => p.period === pReference);
    const vPrec = pPrecedente ? s.find(p => p.period === pPrecedente) : null;
    const varPct = (vRef && vPrec && vPrec.value !== 0)
      ? (vRef.value - vPrec.value) / vPrec.value * 100 : null;
    return {geo: g, valeur: vRef ? vRef.value : null, varPct};
  }).filter(z => z.valeur !== null)
    .sort((a, b) => b.valeur - a.valeur);
  if (!parZone.length) return "";

  const total = parZone.reduce((s, z) => s + z.valeur, 0);
  const seuil = ind.alert_threshold_pct ?? null;

  // Faits saillants : trois réponses directes, toutes recalculables.
  const avecVar = parZone.filter(z => z.varPct !== null);
  const plusForte = avecVar.length ? avecVar.reduce((a, b) => a.varPct > b.varPct ? a : b) : null;
  const plusFort  = avecVar.length ? avecVar.reduce((a, b) => a.varPct < b.varPct ? a : b) : null;
  const faits = `<div class="faits">
    <div class="fait"><div class="f-l">Premier du panier</div>
      <div class="f-v">${esc(parZone[0].geo)}</div>
      <div class="f-s">${nbAuto(parZone[0].valeur)} ${esc(ind.unit)} · ${(parZone[0].valeur / total * 100).toFixed(1)} % du panier</div></div>
    ${plusForte ? `<div class="fait"><div class="f-l">Plus forte progression</div>
      <div class="f-v">${esc(plusForte.geo)}</div>
      <div class="f-s"><span class="hausse">${pct(plusForte.varPct)}</span> sur un an</div></div>` : ""}
    ${plusFort && plusFort.varPct < 0 ? `<div class="fait"><div class="f-l">Plus fort recul</div>
      <div class="f-v">${esc(plusFort.geo)}</div>
      <div class="f-s"><span class="baisse">${pct(plusFort.varPct)}</span> sur un an</div></div>` : ""}
  </div>`;

  const PLAFOND_CARTES = 9;
  const carteDe = (z, i) => `<div class="zc-c">
      <div class="zc-tete"><span class="zc-nom">${esc(z.geo)}</span>${etatZone(z.varPct, seuil)}</div>
      <div class="zc-rang">n° ${i + 1} du panier · ${(z.valeur / total * 100).toFixed(1)} %</div>
      <div class="zc-l" style="margin-top:8px">Valeur · ${esc(pReference)}</div>
      <div class="zc-val">${nbAuto(z.valeur)} <span style="font-size:11px;font-weight:400;color:var(--gris)">${esc(ind.unit)}</span></div>
      <div class="zc-var">${chipVar({glissement_annuel_pct: z.varPct})}</div>
    </div>`;
  const cartes = parZone.slice(0, PLAFOND_CARTES).map(carteDe).join("");
  const resteZones = parZone.slice(PLAFOND_CARTES);
  const repliCartes = resteZones.length
    ? `<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--gris,#666);font-size:12px">Afficher les ${resteZones.length} autres zones du panier</summary><div class="zc" style="margin-top:8px">${resteZones.map((z, i) => carteDe(z, i + PLAFOND_CARTES)).join("")}</div></details>`
    : "";

  let blocPartiel = "";
  if (pRecente !== pReference) {
    const manquent = zonesReelles.filter(g => !periodesParZone.get(g).has(pRecente));
    blocPartiel = `<div class="z-partiel">
      <strong>${esc(pRecente)} est encore incomplète</strong> :
      ${zonesReelles.length - manquent.length} déclarant${zonesReelles.length - manquent.length > 1 ? "s" : ""} sur ${zonesReelles.length}
      ${zonesReelles.length - manquent.length > 1 ? "ont" : "a"} publié (il manque ${manquent.map(esc).join(", ")}).
      Les cartes portent donc sur ${esc(pReference)}, la dernière période où tout le monde a déclaré.
      Classer sur l'année incomplète donnerait une part nulle aux retardataires.
    </div>`;
  }

  return `${faits}
    <div class="zc">${cartes}</div>
    ${repliCartes}
    ${blocPartiel}
    <div class="z-note">Les parts s'entendent sur les ${parZone.length} zones suivies, pas sur le
      marché mondial entier. Les étiquettes sont calculées, pas décidées : au-delà du seuil d'alerte
      (${seuil !== null && seuil !== undefined ? pctNu(seuil) : "pas encore configuré"}), le mouvement
      est marqué ; en deçà, la zone est dite stable. La liste des zones suivies est un choix documenté,
      qui peut évoluer.</div>`;
}

// COMPARAISON DE NIVEAUX — indicateur multi-zones à unité NON additive.
//
// Le classement par part de panier suppose une grandeur extensive. Appliqué à
// T2 (taux de change CHF/USD et CHF/EUR), il produisait « part 53,3 % » : la
// part d'un panier de devises ne signifie rien, et l'arrondi à l'entier
// affichait un taux de 0,93 comme « 1 ». Deux défauts de restitution, aucun de
// collecte — la donnée en base était juste. C'est le cas d'école du § 12.5 :
// une convention d'affichage suffit à fabriquer un signal faux.
//
// La forme retenue compare des niveaux côte à côte, sans barre proportionnelle
// et sans part, et énonce pourquoi.
function comparaisonNiveaux(ind, zones) {
  const zonesReelles = zones.filter(g => !estAgregatMonde(g));
  if (!zonesReelles.length) return "";

  const parZone = zonesReelles.map(g => {
    const s = serieDe(ind, g);
    const derniere = s[s.length - 1];
    const homologue = derniere ? s.filter(p => p.period < derniere.period).pop() : null;
    const varPct = (derniere && homologue && homologue.value !== 0)
      ? (derniere.value - homologue.value) / homologue.value * 100 : null;
    return {geo: g, periode: derniere ? derniere.period : null,
            valeur: derniere ? derniere.value : null, varPct};
  }).filter(z => z.valeur !== null).sort((a, b) => b.valeur - a.valeur);

  if (!parZone.length) return "";

  // Plafond d'affichage (17.08.2026) : M3 apporte ~190 pays — dérouler la
  // liste entière noyait la page. Niveaux les plus élevés d'abord, le reste
  // replié mais accessible : rien n'est caché, tout est hiérarchisé.
  const PLAFOND = 12;
  const ligneDe = z => `<div class="z-ligne">
      <span class="z-nom">${esc(z.geo)}</span>
      <span class="z-part" style="text-align:left">${esc(ind.unit)}</span>
      <span class="z-val">${nbAuto(z.valeur)}</span>
      <span class="z-part">${esc(z.periode)}</span>
      <span class="z-var ${signe(z.varPct)}">${pct(z.varPct)}</span>
    </div>`;
  const lignes = parZone.slice(0, PLAFOND).map(ligneDe).join("");
  const reste = parZone.slice(PLAFOND);
  const repli = reste.length
    ? `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--gris,#666);font-size:12px">Afficher les ${reste.length} autres zones</summary>${reste.map(ligneDe).join("")}</details>`
    : "";

  return `<div class="z-classement">
    <div class="z-refper">Niveaux à la dernière période de chaque série,
      variation contre la période précédente${reste.length ? " — les " + PLAFOND + " niveaux les plus élevés d'abord" : ""}</div>
    <div class="z-entete"><span></span><span style="text-align:left">unité</span>
      <span>niveau</span><span>période</span><span>var.</span></div>
    ${lignes}
    ${repli}
    <div class="z-note">Pas de part de panier ici : additionner des ${esc(ind.unit)} n'aurait aucun
      sens, chaque série se lit à son propre niveau.</div>
  </div>`;
}

// MENTION D'EXÉCUTION. L'outil vivant se démontre par l'écart entre exécutions ;
// afficher le seul numéro de run ne dit rien de cet écart. Les trois formulations
// correspondent à trois états distincts du dossier et ne doivent pas être
// confondues : une révision constatée, une absence de révision constatée sur
// comparaison effective, et une absence de comparaison — ce dernier cas n'étant
// pas un résultat mais une absence de résultat.
function mentionRun(ind) {
  const rev = (D.revisions || []).filter(e => e.indicator_id === ind.indicator_id);
  if (rev.length) {
    const d = rev[rev.length - 1];
    return `run ${esc(ind.dernier_run)} · révision constatée : ${esc(d.period)} ${pct(d.ecart_pct)} au run ${esc(d.run_id)}`;
  }
  return Number(D.comparaisons_runs || 0) > 0
    ? `run ${esc(ind.dernier_run)} · aucune révision constatée`
    : `run ${esc(ind.dernier_run)} · aucune comparaison entre exécutions à ce jour`;
}

function carte(ind) {
  const zones = zonesDe(ind);
  const multiZones = zones.filter(g => !estAgregatMonde(g)).length > 1;

  // La ligne « ce qu'il indique » vient de la base (indicators.description_metier,
  // migration du 10.08). Si la colonne n'est pas encore servie par l'API, la
  // ligne est simplement absente — jamais de texte métier en dur dans la page.
  const tete = `<div class="c-tete">
      <span class="c-code">${esc(ind.indicator_id)} · ${esc(ind.category === "hard" ? "donnée officielle" : "composite")}</span>
      ${badgeStatut(ind.status)}
    </div>
    <div class="c-titre">${esc(ind.label)}</div>
    ${ind.description_metier ? `<div class="c-quoi">${esc(ind.description_metier)}</div>` : ""}`;

  const pied = `<div class="c-pied">
      <span>${esc(ind.source_organisation)} · ${esc(ind.frequency)}</span>
      <a href="${esc(ind.source_url)}" target="_blank" rel="noopener">source</a>
    </div>`;

  // Indicateur qualifié mais non instrumenté : dit tel quel, jamais masqué.
  if (!ind.observations || ind.observations === 0) {
    return `<div class="carte vide">${tete}
      <div class="c-absent"><span class="etiq e-gris">qualifié, non instrumenté</span></div>
      <div class="c-manque">Aucune collecte à ce jour.
        ${ind.liaisons_actives > 0
          ? "Une liaison de collecte est active : la prochaine exécution renseignera cet indicateur."
          : "La connexion à la source n'a pas encore été vérifiée : ses paramètres d'accès restent à confirmer."}</div>
      ${pied}</div>`;
  }

  const met = (D.metriques || []).find(m => m.indicator_id === ind.indicator_id);

  // Provenance et volumétrie repliées. Elles doivent rester accessibles — c'est
  // la thèse du travail — sans occuper au premier plan plus de surface que le
  // signal qu'elles documentent. Le statut de validation et la source restent
  // visibles en permanence : ce sont eux qui conditionnent la lecture.
  const provenance = `<details class="prov"><summary>provenance et fraîcheur</summary>
      <div class="p-corps">
        ${ind.observations} observation${ind.observations > 1 ? "s" : ""} au registre,
        de ${esc(ind.p_min)} à ${esc(ind.p_max)} · fréquence ${esc(ind.frequency)} ·
        unité : ${esc(ind.unit)}.<br>
        Qualification de la source : ${esc(ind.qualification_status ?? "non renseignée")} ·
        dernière exécution ayant écrit cet indicateur : run ${esc(ind.dernier_run)}.
      </div></details>`;

  // --- Indicateur multi-zones : classement ou comparaison de niveaux, jamais
  //     de valeur unique. La forme dépend du caractère additif de l'unité. ---
  //
  // LA TENDANCE D'ABORD, LA STRUCTURE ENSUITE (revue du 12.08). Le classement
  // répond à « qui pèse quoi » ; il ne répond pas à « où va le marché », qui
  // est la première question du lecteur. Quand la source publie un agrégat
  // monde (exclu du classement, à raison : il doublerait le total), sa série
  // est déjà au registre — elle est désormais affichée en tête de carte,
  // avec ses métriques et sa position au seuil.
  if (multiZones) {
    const periodes = [...new Set(serieDe(ind).map(p => p.period))].sort();
    const additive = estAdditive(ind.unit);

    const geoAgg = zones.find(estAgregatMonde);
    let blocAgregat = "";
    if (geoAgg) {
      const sAgg = serieDe(ind, geoAgg);
      const metAgg = (D.metriques || []).find(m => m.indicator_id === ind.indicator_id && m.geo === geoAgg);
      if (sAgg.length > 2) {
        const repereAgg = metAgg ? metAgg.moyenne_mobile_annuelle : null;
        blocAgregat = `<div class="c-val">${nbAuto(metAgg ? metAgg.value : sAgg[sAgg.length - 1].value)}<span class="c-unite">${esc(ind.unit)} · total monde · ${esc(metAgg ? metAgg.period : sAgg[sAgg.length - 1].period)}</span>${chipVar(metAgg)}</div>
          ${spark(sAgg, repereAgg, repereAgg !== null && repereAgg !== undefined ? "moyenne mobile" : "")}
          ${metAgg ? ligneSeuil(metAgg) : ""}
          <div class="c-legende" style="margin-bottom:10px">La courbe montre le total publié par la
            source ; le détail par zone suit juste en dessous.</div>`;
      }
    }

    return `<div class="carte carte-large">${tete}
      <div class="c-per">Dernière période observée : ${esc(periodes[periodes.length - 1])}${
        additive ? " · valeurs en " + esc(ind.unit) + ", courantes" : ""}</div>
      ${blocAgregat}
      ${additive ? cartesZones(ind, zones) : comparaisonNiveaux(ind, zones)}
      <div class="c-pied">
        <span>${badgeValidation(met ? met.validation_status : null)}</span>
        <span class="c-run">${mentionRun(ind)}</span>
      </div>
      ${provenance}
      ${pied}</div>`;
  }

  // --- Série unique : valeur, courbe, métriques adaptées à la fréquence ---
  // Une zone pays + un agrégat monde : privilégier l'agrégat, c'est lui que la
  // carte à valeur unique sait résumer sans choisir arbitrairement un pays.
  const geoUnique = zones.length === 1 ? zones[0] : (zones.find(estAgregatMonde) ?? zones[0]);
  const serie = serieDe(ind, geoUnique);
  const derniere = serie[serie.length - 1];
  const etiquetteZone = (!estAgregatMonde(geoUnique) && geoUnique !== "EU27_2020")
    ? geoUnique
    : ({WORLD: "monde", W00: "monde", OWID_WRL: "monde", EU27_2020: "UE27"}[geoUnique] ?? geoUnique);
  const repere = met ? met.moyenne_mobile_annuelle : null;
  const repereTrace = serie.length > 2 && repere !== null && repere !== undefined && !isNaN(repere);

  return `<div class="carte">${tete}
    <div class="c-val">${nbAuto(met ? met.value : derniere.value)}<span class="c-unite">${esc(ind.unit)} · ${esc(etiquetteZone)} · ${esc(met ? met.period : derniere.period)}</span>${chipVar(met)}</div>
    ${serie.length > 2 ? spark(serie, repere, repereTrace ? "moyenne mobile" : "") : ""}
    ${repereTrace ? `<div class="c-legende">La ligne pointillée donne la moyenne des douze derniers
      mois (${nbAuto(repere)}) : c'est le repère pour situer la dernière valeur.</div>` : ""}
    ${blocMetriques(met, serie)}
    ${afficherCompletude(met)}
    <div class="c-pied">
      <span>${badgeValidation(met ? met.validation_status : null)}</span>
      <span class="c-run">${mentionRun(ind)}</span>
    </div>
    ${provenance}
    ${pied}</div>`;
}

// ---------------------------------------------------------------------
// COUCHE DE LECTURE.
//
// La restitution montrait des mesures sans jamais dire ce qu'il fallait en
// penser. Le correctif ne consiste pas à faire commenter un modèle : il
// consiste à énoncer ce que la couche déterministe établit déjà — combien de
// séries progressent, combien franchissent leur seuil, lesquelles sont
// diffusables au sens de RI5, à quelle date remonte l'observation la plus
// ancienne du secteur. Chaque terme de la phrase est recalculable ; aucun
// n'est une interprétation. RI10 tient : rien n'est dit d'une cause.
// ---------------------------------------------------------------------
function lectureSecteur(code, inds) {
  const codes = new Set(inds.map(i => i.indicator_id));
  const met = (D.metriques || []).filter(m => codes.has(m.indicator_id));

  if (!met.length) {
    return `<div class="lecture"><div class="l-txt">Rien n'a encore été collecté pour ce secteur.
      La page le dit plutôt que de le cacher.</div></div>`;
  }

  const varDe = m => m.glissement_annuel_pct ?? m.variation_periode_pct;
  const chiffres = met.filter(m => varDe(m) !== null && varDe(m) !== undefined && !isNaN(varDe(m)));
  const hausse = chiffres.filter(m => Number(varDe(m)) > 0).length;
  const baisse = chiffres.filter(m => Number(varDe(m)) < 0).length;
  const sansVar = met.length - chiffres.length;
  const nbInd = new Set(met.map(m => m.indicator_id)).size;

  const franchis = met.filter(m => String(m.franchissement || "").startsWith("franchi"));
  const diffusables = franchis.filter(m => ["valide_source", "valide_humain"].includes(m.validation_status));
  const retenus = franchis.length - diffusables.length;

  const periodes = met.map(m => String(m.period)).filter(Boolean).sort();

  let txt = `Ce secteur compte <strong>${met.length} série${met.length > 1 ? "s" : ""} suivie${met.length > 1 ? "s" : ""}</strong>
    (${nbInd} indicateur${nbInd > 1 ? "s" : ""}, décliné${nbInd > 1 ? "s" : ""} par zone) :
    <strong>${hausse}</strong> ${hausse > 1 ? "progressent" : "progresse"}, <strong>${baisse}</strong> ${baisse > 1 ? "reculent" : "recule"}`;
  txt += sansVar
    ? `, et ${sansVar} n'${sansVar > 1 ? "ont" : "a"} pas encore assez d'historique pour être comparée${sansVar > 1 ? "s" : ""}.`
    : `.`;
  txt += franchis.length
    ? ` <strong>${franchis.length}</strong> mouvement${franchis.length > 1 ? "s" : ""} sort${franchis.length > 1 ? "ent" : ""} de
       l'ordinaire pour ${franchis.length > 1 ? "leurs séries" : "sa série"} : ${diffusables.length} ${diffusables.length > 1 ? "sont" : "est"}
       affiché${diffusables.length > 1 ? "s" : ""} en tête de page${retenus ? `, ${retenus} attend${retenus > 1 ? "ent" : ""} encore
       une validation avant d'être montré${retenus > 1 ? "s" : ""}` : ""}.`
    : ` Aucun mouvement ne sort de l'ordinaire ce mois-ci.`;
  txt += ` Les données vont de ${esc(periodes[0])} à ${esc(periodes[periodes.length - 1])}.`;

  // Le socle transversal n'est pas un secteur : sa lecture est le dénominateur
  // de l'attribution posée par QV0. La phrase est un rappel de méthode, pas une
  // conclusion sur les chiffres.
  const attribution = code === "transversal"
    ? `<br>Ces valeurs donnent le point de comparaison : si un secteur bouge dans le même sens et
       dans les mêmes proportions que la conjoncture générale, le mouvement ne lui est pas propre.
       Cette comparaison reste à faire par le lecteur, l'outil ne la fait pas à sa place.`
    : "";

  return `<div class="lecture">
    <div class="l-txt">${txt}${attribution}</div>
    <div class="l-org">Ce résumé est composé automatiquement à partir des chiffres calculés en base
      (variations annuelles, seuils d'alerte, statuts de validation). Aucune intelligence artificielle
      ne le rédige, et il ne se prononce jamais sur les causes.</div>
  </div>`;
}

// ---------------------------------------------------------------------
// SIGNAUX QUALITATIFS — le versant « veille » du dispositif (12.08.2026).
//
// Un signal n'est pas une observation de série : c'est un événement
// structuré extrait d'un document non périodique (règlement, annonce),
// par la chaîne multi-modèles démontrée sur A2, et validé humainement.
// Trois règles de restitution :
//   1. Seuls les signaux VALIDÉS s'affichent en clair — les « à valider »
//      remontent en compteur (analogue de RI5 pour le qualitatif).
//   2. La note de portée est signée : c'est un jugement humain, pas une
//      production du modèle, et la carte le dit.
//   3. Trois états : clé absente = « non interrogé », jamais « aucun
//      signal » — même garde-fou que le bandeau des franchissements.
// ---------------------------------------------------------------------
function vueSignauxSecteur(code) {
  if (D.signaux === undefined) {
    return `<section class="qv"><div class="qv-tete"><div class="qv-q">Signaux qualitatifs</div></div>
      <p class="note">Signaux non interrogés : l'interface de restitution ne renvoie pas la vue
      <code>v_signaux</code>. Absence d'interrogation, non absence de signal.</p></section>`;
  }
  const tous = (D.signaux || []).filter(s => s.sector_code === code);
  if (!tous.length) return "";
  const valides = tous.filter(s => s.statut === "valide");
  const enAttente = tous.filter(s => s.statut === "a_valider").length;

  const carteSignal = s => `<div class="carte">
      <div class="c-tete">
        <span class="c-code">SIGNAL · ${esc(s.watch_question_code)}</span>
        <span class="etiq e-vert">validé humainement</span>
      </div>
      <div class="c-titre">${esc(s.evenement ?? "(événement à préciser)")}</div>
      <div class="c-quoi">${esc(s.acteur ?? "—")} · ${esc(s.zone ?? "—")} · échéance ${esc(s.echeance ?? "—")}</div>
      ${s.note_validation ? `<div class="c-seuil"><b>Ce que ça change pour un sous-traitant :</b> ${esc(s.note_validation)}
        <span style="color:var(--gris-clair)">(analyse de ${esc(s.validated_by)})</span></div>` : ""}
      <details class="prov"><summary>provenance et extraction</summary>
        <div class="p-corps">Document choisi à la main, lu par trois IA qui doivent chacune citer
          le passage exact d'où vient l'information (accord entre elles :
          ${s.score_recoupement !== null ? Math.round(s.score_recoupement * 100) + " %" : "—"}).
          Relu et validé le ${esc(String(s.validated_at ?? "").slice(0, 10))} par ${esc(s.validated_by ?? "—")} · run ${esc(s.run_id)}.</div>
      </details>
      <div class="c-pied">
        <span>signal qualitatif · ne compte pas dans les séries chiffrées</span>
        <a href="${esc(s.source_doc)}" target="_blank" rel="noopener">document source</a>
      </div>
    </div>`;

  return `<section class="qv">
    <div class="qv-tete">
      <div class="qv-code">SIGNAUX QUALITATIFS · documents non périodiques</div>
      <div class="qv-q">Ce qui se décide autour du marché : règlements, annonces, événements</div>
      <div class="qv-m">Ces signaux ne sont pas des chiffres de série : ce sont des événements repérés
        dans des documents, relus et validés par un humain avant d'apparaître ici.
        ${enAttente ? `<strong>${enAttente} signal${enAttente > 1 ? "aux" : ""} en attente de relecture</strong>,
        non affiché${enAttente > 1 ? "s" : ""} tant que personne ne ${enAttente > 1 ? "les" : "l'"}a tranché${enAttente > 1 ? "s" : ""}.` : ""}</div>
    </div>
    ${valides.length
      ? `<div class="cartes">${valides.map(carteSignal).join("")}</div>`
      : `<p class="note"><em>Aucun signal validé pour ce secteur à ce jour.</em></p>`}
  </section>`;
}

// COMMENTAIRE EXÉCUTIF VALIDÉ. Seuls les commentaires validés par un humain
// sont servis par l'API (un a_valider n'en sort jamais) ; la page affiche le
// plus récent par secteur avec sa provenance complète : modèle, règles,
// validateur, date. Trois états : clé absente = non interrogé, aucun validé
// = dit tel quel avec le compteur d'attente, validé = affiché.
function blocCommentaire(code) {
  if (D.commentaires === undefined) return "";
  const c = (D.commentaires || []).find(k => k.sector_code === code);
  const enAttente = Number(D.commentaires_en_attente || 0);
  if (!c) return enAttente
    ? `<p class="note">Commentaire exécutif : aucun commentaire validé pour ce secteur — ${enAttente} en attente de validation humaine.</p>`
    : "";
  const texte = esc(c.text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br>");
  const quand = c.validated_at ? new Date(c.validated_at).toLocaleDateString("fr-CH") : "";
  return `<section class="qv">
    <div class="qv-tete">
      <div class="qv-code">Commentaire exécutif
        <span class="etiq e-gris">généré par modèle (${esc(c.model)}) sous règles RI0-RI10</span>
        <span class="etiq e-vert">validé par ${esc(c.validated_by || "?")}${quand ? " le " + quand : ""}</span></div>
    </div>
    <div style="font-size:13px;line-height:1.55;padding:4px 2px">${texte}</div>
    ${enAttente ? `<p class="note">${enAttente} commentaire(s) plus récent(s) en attente de validation humaine.</p>` : ""}
  </section>`;
}

// INDICATEUR SYNTHÉTIQUE (engagement de la ratification). Servi par la vue
// v_indicateur_synthetique : la part n'existe qu'à panier complet, la ligne
// non calculable s'affiche avec son motif — la règle du déclarant le plus
// lent est montrée au décideur, jamais corrigée en douce.
function blocSynthetique() {
  if (D.synthetique === undefined) return "";
  const s = D.synthetique || [];
  if (!s.length) return "";
  const calculables = s.filter(x => x.part_suisse_pct !== null);
  const derniere = calculables[calculables.length - 1];
  const lignes = s.map(x => `<tr>
      <td><strong>${esc(x.period)}</strong></td>
      <td>${x.part_suisse_pct !== null ? nbAuto(x.part_suisse_pct) + " %" : "—"}</td>
      <td>${nbAuto(x.che_mia_usd)}</td>
      <td>${nbAuto(x.total_panier_mia_usd)}</td>
      <td>${x.nb_declarants} / ${x.nb_declarants_attendus}</td>
      <td style="font-size:12px;color:var(--gris,#666)">${esc(x.completude || "")}</td>
    </tr>`).join("");
  return `<section class="qv">
    <div class="qv-tete">
      <div class="qv-code">Indicateur synthétique · part suisse du commerce horloger (SH 91)</div>
      <div class="qv-q">${derniere ? `Dernière part calculable : <strong>${nbAuto(derniere.part_suisse_pct)} %</strong> du panier de déclarants en ${esc(derniere.period)}.` : `Aucune part calculable pour l'instant.`}
        Ratio calculé par requête sur les séries H3 consolidées — aucun modèle n'intervient.</div>
    </div>
    <table><tr><th>Année</th><th>Part suisse</th><th>CHE (mia USD)</th><th>Panier (mia USD)</th><th>Déclarants</th><th></th></tr>${lignes}</table>
    <div class="z-note">Part du panier de déclarants Comtrade (7 pays), non du marché mondial entier.
      La part n'est calculée que si tous les déclarants ont soumis l'année : la fraîcheur d'un panier
      est celle de son déclarant le plus lent.</div>
  </section>`;
}

function vueSecteur(code) {
  const inds = (D.referentiel || []).filter(i => i.sector_code === code);
  if (!inds.length) return `<p class="note">Aucun indicateur pour ce secteur.</p>`;

  const qvs = (D.instanciation || []).filter(q => q.sector_code === code);
  const collectes = inds.filter(i => i.observations > 0).length;

  let html = "";
  if (code === "transversal") {
    html += `<p class="note">Cette page ne décrit pas un secteur : elle donne le contexte général.
      Elle répond à une question simple : quand un secteur bouge, est-ce lui qui bouge, ou toute
      l'économie ? Sans ce point de comparaison, une baisse sectorielle ne se lit pas.</p>`;
  }
  if (code === "transversal") html += blocSynthetique();
  html += lectureSecteur(code, inds);
  html += blocCommentaire(code);
  html += `<p class="note"><strong>${collectes} indicateur${collectes > 1 ? "s" : ""} collecté${collectes > 1 ? "s" : ""}
    sur ${inds.length}</strong> pour ce secteur. Ceux qui ne sont pas encore branchés restent
    visibles : la grille montre ce que l'outil est prévu pour suivre, la page montre ce qu'il suit
    réellement.</p>`;

  // RESTRUCTURATION DU 17.08.2026 (constat d'écran). La doctrine reste
  // « questions → indicateurs », mais l'ancienne forme rendait la carte
  // COMPLÈTE sous CHAQUE question couverte : H3 (QV2, QV3) apparaissait
  // deux fois, la page semblait se répéter. Désormais : les questions en
  // panneau compact (avec les codes des indicateurs qui les couvrent et
  // le mécanisme replié), puis chaque carte UNE seule fois, collectées
  // d'abord.
  if (qvs.length) {
    const panneaux = qvs
      .sort((a, b) => a.watch_question_code.localeCompare(b.watch_question_code))
      .map(q => {
        const codes = inds
          .filter(i => (i.questions || "").split(",").includes(q.watch_question_code))
          .map(i => i.indicator_id);
        const lacune = Number(q.nb_certifies) === 0;
        return `<div class="qv-tete" style="margin-top:12px">
          <div class="qv-code">${esc(q.watch_question_code)} · ${esc(q.question_generique)}
            ${badgeCriticite(q.criticite)}
            ${lacune
              ? '<span class="etiq e-rouge">non couverte</span>'
              : `<span class="etiq e-gris">${codes.map(esc).join(" · ")}</span>`}</div>
          <div class="qv-q">${esc(q.question_sectorielle)}</div>
          <details><summary style="cursor:pointer;font-size:12px;color:var(--gris,#666)">mécanisme causal</summary>
            <div class="qv-m">${esc(q.mecanisme)}</div></details>
        </div>`;
      }).join("");
    html += `<section class="qv">
      <div class="qv-tete"><div class="qv-q">Ce que ce secteur surveille, et pourquoi</div></div>
      ${panneaux}
      <p class="note">Une question « non couverte » est un manque affiché plutôt que caché :
        le sujet existe, il n'est simplement pas encore suivi.</p>
    </section>`;
  }

  const ordonnes = [...inds].sort((a, b) =>
    (b.observations > 0) - (a.observations > 0)
    || String(a.indicator_id).localeCompare(String(b.indicator_id)));
  html += `<div class="cartes">${ordonnes.map(carte).join("")}</div>`;
  html += vueSignauxSecteur(code);
  return html;
}

function vueReferentiel() {
  const r = D.referentiel || [];
  const lignes = r.map(i => `<tr>
      <td><strong>${esc(i.indicator_id)}</strong></td>
      <td>${esc(i.sector_label)}</td>
      <td>${esc(i.label)}</td>
      <td>${esc(i.questions || "—")}</td>
      <td>${esc(i.source_organisation)}</td>
      <td>${i.category === "hard" ? "officielle" : "composite"}</td>
      <td>${badgeStatut(i.status)}</td>
      <td>${i.observations > 0
            ? `${i.observations} obs. · ${esc(i.p_min)} → ${esc(i.p_max)}`
            : '<span class="etiq e-gris">non instrumenté</span>'}</td>
    </tr>`).join("");

  const bilan = (D.bilan_referentiel || []).map(b => `<tr>
      <td>${b.sector_code ? esc(b.sector_code) : "<strong>Total</strong>"}</td>
      <td>${b.total}</td><td>${b.certifies}</td><td>${b.certifies_hard}</td>
      <td>${b.certifies_composite}</td><td>${b.a_confirmer}</td></tr>`).join("");

  return `<h2>Bilan du référentiel</h2>
    <p class="note">Ce décompte vient directement de la base, il fait référence : si un autre
      chiffre circule ailleurs (rapport, annexes), c'est l'autre chiffre qui est faux.</p>
    <table><tr><th>Secteur</th><th>Total</th><th>Certifiés</th><th>dont officielles</th>
      <th>dont composites</th><th>À confirmer</th></tr>${bilan}</table>
    <h2>Les 26 indicateurs de la grille</h2>
    <table><tr><th>Code</th><th>Secteur</th><th>Indicateur</th><th>Questions</th><th>Source</th>
      <th>Catégorie</th><th>Qualification</th><th>Instrumentation</th></tr>${lignes}</table>`;
}

function vueExecutions() {
  const runs = (D.sante_runs || []).map(s => `<tr>
      <td>${s.run_id}</td>
      <td>${new Date(s.executed_at).toLocaleString("fr-CH")}</td>
      <td>${esc(s.status)}</td>
      <td>${s.valeurs_ecrites}</td>
      <td>${s.indicateurs_couverts} / ${s.indicateurs_certifies_attendus}</td>
    </tr>`).join("");

  const rev = (D.revisions || []);
  const revHtml = rev.length
    ? `<table><tr><th>Indicateur</th><th>Période</th><th>Zone</th><th>Run</th><th>Écart</th></tr>
        ${rev.map(e => `<tr><td>${esc(e.indicator_id)}</td><td>${esc(e.period)}</td>
          <td>${esc(e.geo)}</td><td>${e.run_id}</td><td>${pct(e.ecart_pct)}</td></tr>`).join("")}</table>`
    : `<p class="note">Aucune révision repérée sur ${D.comparaisons_runs ?? 0} comparaison(s) entre exécutions :
        pour l'instant, aucune source n'a corrigé une valeur déjà publiée entre deux collectes.
        Le mécanisme de détection tourne, il n'a simplement encore rien attrapé.</p>`;

  return `<h2>Exécutions</h2>
    <p class="note">Chaque collecte ajoute ses observations sans jamais écraser les précédentes.
      C'est en comparant les exécutions entre elles qu'on voit les tendances et les corrections des sources.</p>
    <table><tr><th>Run</th><th>Exécuté le</th><th>Statut</th><th>Valeurs écrites</th>
      <th>Indicateurs couverts</th></tr>${runs}</table>
    <h2>Révisions constatées par la source</h2>${revHtml}`;
}

function rendre() {
  document.getElementById("nav").innerHTML =
    SECTEURS.map(([c, l]) => `<button data-o="${c}" class="${onglet === c ? "actif" : ""}">${l}</button>`).join("")
    + `<button data-o="referentiel" class="${onglet === "referentiel" ? "actif" : ""}">Référentiel complet</button>`
    + `<button data-o="executions" class="${onglet === "executions" ? "actif" : ""}">Exécutions</button>`;

  document.querySelectorAll("nav button").forEach(b =>
    b.onclick = () => { onglet = b.dataset.o; rendre(); window.scrollTo(0, 0); });

  document.getElementById("vue").innerHTML =
    onglet === "referentiel" ? vueReferentiel()
    : onglet === "executions" ? vueExecutions()
    : vueSecteur(onglet);
}

// FRANCHISSEMENTS DE SEUIL EN TÊTE DE PAGE.
//
// La vue v_alertes_candidates existait en base depuis le 07.08 et n'était lue
// par aucune vue de la restitution : la couche de lecture était calculée et
// non consommée. Elle l'est désormais, avec la distinction que la vue porte —
// diffusable au sens de RI5, ou retenue avec son motif.
//
// TROIS ÉTATS, PAS DEUX. L'absence de la clé « alertes » dans la charge utile
// n'est pas l'absence de franchissement : c'est l'absence d'interrogation. Les
// confondre afficherait « aucun signal » alors que rien n'a été demandé — la
// forme de surdéclaration la plus difficile à détecter, puisqu'elle rassure.
function blocSignaux() {
  if (D.alertes === undefined) {
    return `<span class="sig inconnu">Alertes indisponibles</span>
      Le service de données ne renvoie pas les alertes pour l'instant. Attention à la nuance :
      cela ne veut pas dire qu'il ne se passe rien, cela veut dire que la question n'a pas pu être posée.`;
  }
  const alertes = D.alertes || [];
  if (!alertes.length) {
    return `<span class="sig calme">Rien d'inhabituel</span>
      sur les dernières observations. Aucune série suivie ne dépasse son seuil d'alerte.
      Les indicateurs sans seuil configuré ne comptent pas ici : leur carte le précise.`;
  }
  const diffusables = alertes.filter(a => a.diffusable);
  const retenues = alertes.filter(a => !a.diffusable);

  // REGROUPEMENT PAR INDICATEUR. La première exécution réelle a affiché
  // trente-trois pastilles au même rang visuel : l'égalité de traitement
  // détruisait le signal qu'elle devait porter. Le regroupement est
  // déterministe — par indicateur, avec le nombre de zones, les extrêmes et
  // la période — et le détail par zone reste accessible, replié. La
  // hiérarchisation de fond — pourquoi 33 franchissements ? — ne se corrige
  // pas ici : elle relève du calibrage des seuils en base (RI4), jamais
  // confrontés aux données avant cette exécution. Un seuil que toutes les
  // séries franchissent ne discrimine rien.
  const parInd = new Map();
  for (const a of alertes) {
    if (!parInd.has(a.indicator_id)) parInd.set(a.indicator_id, []);
    parInd.get(a.indicator_id).push(a);
  }
  const chips = [...parInd.entries()].map(([id, liste]) => {
    const l0 = liste[0];
    const vals = liste.map(a => Number(a.glissement_annuel_pct ?? a.variation_periode_pct));
    const periodes = [...new Set(liste.map(a => String(a.period)))].sort();
    const nbRet = liste.filter(a => !a.diffusable).length;
    const detail = liste
      .sort((a, b) => Math.abs(Number(b.glissement_annuel_pct ?? b.variation_periode_pct))
                    - Math.abs(Number(a.glissement_annuel_pct ?? a.variation_periode_pct)))
      .map(a => `${esc(a.geo)} ${esc(a.period)} : ${pct(a.glissement_annuel_pct ?? a.variation_periode_pct)}${
        a.diffusable ? "" : " · retenue : " + esc(a.motif_de_retenue)}`).join("<br>");
    return `<span class="sig ${nbRet === liste.length ? "retenu" : "diffusable"}">
      <strong>${esc(id)}</strong> ${esc(l0.indicator_label)} ·
      ${liste.length > 1
        ? `${liste.length} zones, de ${pct(Math.min(...vals))} à ${pct(Math.max(...vals))}`
        : `${esc(l0.geo)} ${pct(vals[0])}`} ·
      seuil ${pctNu(l0.seuil_materialite_pct)} ·
      ${periodes.length > 1 ? esc(periodes[0]) + " → " + esc(periodes[periodes.length - 1]) : esc(periodes[0])}
      ${nbRet && nbRet < liste.length ? ` · ${nbRet} retenue${nbRet > 1 ? "s" : ""} (RI5)` : ""}
      <details class="prov"><summary>détail par zone</summary><div class="p-corps">${detail}</div></details>
    </span>`;
  }).join("");

  return `<strong>${alertes.length} mouvement${alertes.length > 1 ? "s" : ""} sort${alertes.length > 1 ? "ent" : ""}
    de l'ordinaire</strong> sur la dernière observation, sur ${parInd.size} indicateur${parInd.size > 1 ? "s" : ""}.
    ${diffusables.length ? `${diffusables.length} ${diffusables.length > 1 ? "sont" : "est"} affiché${diffusables.length > 1 ? "s" : ""} ci-dessous.` : ""}
    ${retenues.length ? `${retenues.length} attend${retenues.length > 1 ? "ent" : ""} encore une validation avant d'être montré${retenues.length > 1 ? "s" : ""}.` : ""}
    <div class="signaux">${chips}</div>`;
}

function bandeau() {
  const r = D.referentiel || [];
  const total = r.length;
  const certifies = r.filter(i => i.status === "certifie").length;
  const collectes = r.filter(i => i.observations > 0).length;
  const obs = r.reduce((s, i) => s + Number(i.observations || 0), 0);
  const runs = (D.sante_runs || []).length;

  // ORDRE DE LECTURE INVERSÉ. Le bandeau ne portait que des compteurs de
  // couverture — indicateurs qualifiés, certifiés, instrumentés, observations,
  // exécutions. Ce sont des métriques de l'instrument, pas du marché : un
  // décideur y lisait l'inventaire de l'outil avant tout signal. Les signaux
  // passent devant, la couverture reste, en second rang et sous son vrai nom.
  document.getElementById("bandeau").innerHTML = `
    <div class="b-signal">${blocSignaux()}</div>
    <div class="b-kpis">
      <div class="l-sec">Couverture du dispositif</div>
      <div class="kpi"><div class="v">${total}</div><div class="l">indicateurs qualifiés</div></div>
      <div class="kpi"><div class="v">${certifies}</div><div class="l">certifiés</div></div>
      <div class="kpi"><div class="v">${collectes} <span style="font-size:14px;color:var(--gris)">/ ${certifies}</span></div><div class="l">instrumentés</div></div>
      <div class="kpi"><div class="v">${obs}</div><div class="l">observations au registre</div></div>
      <div class="kpi"><div class="v">${runs}</div><div class="l">exécutions</div></div>
    </div>`;

  const rc = D.run_courant;
  document.getElementById("meta").textContent =
    "Données lues en base le " + new Date(D.genere_le).toLocaleString("fr-CH")
    + (rc ? " · dernière exécution n° " + rc.run_id + " (" + rc.status + ")" : " · aucune exécution close");
}

fetch(API, {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error("réponse " + r.status); return r.json(); })
  .then(charge => {
    // Normalisation de la forme de la réponse. L'orchestrateur peut livrer la
    // charge utile de trois manières selon sa configuration : l'objet lui-même,
    // un tableau d'un seul élément, ou une chaîne JSON encodée une seconde fois.
    // Supposer une seule forme produisait un affichage entièrement vide SANS
    // lever d'erreur — le pire des comportements, puisque rien ne signalait que
    // la donnée était pourtant arrivée.
    let d = charge;
    if (typeof d === "string") d = JSON.parse(d);
    if (Array.isArray(d)) d = d[0];
    if (d && d.payload !== undefined) d = d.payload;
    if (typeof d === "string") d = JSON.parse(d);

    if (!d || !Array.isArray(d.referentiel)) {
      throw new Error(
        "réponse reçue mais inexploitable : le référentiel est absent de la charge utile (clés reçues : "
        + (d && typeof d === "object" ? Object.keys(d).join(", ") : typeof d) + ")");
    }

    D = d;
    bandeau();
    rendre();
    if ((D.referentiel || []).filter(i => i.observations > 0).length < (D.referentiel || []).length) {
      document.getElementById("vue").insertAdjacentHTML("afterbegin",
        `<div class="avert"><strong>Comment lire cette page.</strong> Tous les indicateurs prévus sont
         affichés, même ceux qui n'ont pas encore de données. Une carte vide n'est pas un bug : elle
         montre ce que l'outil est prévu pour suivre mais ne suit pas encore. On préfère montrer ce
         manque que le cacher.</div>`);
    }
  })
  .catch(e => {
    document.getElementById("meta").textContent = "Base inaccessible";
    document.getElementById("bandeau").innerHTML = "";
    document.getElementById("vue").innerHTML =
      `<div class="erreur"><strong>Aucune donnée ne peut être affichée pour le moment.</strong>
       <p>Cette page ne stocke rien : elle lit la base à chaque ouverture. Tant que la connexion
       ne répond pas, elle préfère ne rien montrer plutôt que d'afficher des chiffres périmés
       sans qu'on puisse s'en rendre compte.</p>
       <p style="font-size:12px;color:var(--gris)">Détail technique : ${esc(e.message)}. Vérifier que les
       services sont démarrés et que le workflow « API de restitution » est actif dans n8n.</p></div>`;
  });
</script>
</body>
</html>
